# Default labels configurations
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "feature"
  color: "a2eeef"
  description: "New feature or request"
- name: "enhancement"
  color: "a2eeef"
  description: "Improvements to existing code"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"
- name: "agent"
  color: "bfd4f2"
  description: "Related to AI agents workflows"
- name: "github"
  color: "bfdadc"
  description: "Related to GitHub Webhooks or APIs"
- name: "memory"
  color: "5319e7"
  description: "Related to short-term/long-term storage adapters"
- name: "rag"
  color: "1d76db"
  description: "Related to Knowledge Base and context parsing"
- name: "tooling"
  color: "fef2c0"
  description: "Related to package manager, TS, ESLint configurations"
- name: "blocked"
  color: "cfd3d7"
  description: "Blocked on external libraries or API decisions"
- name: "needs discussion"
  color: "e99695"
  description: "Requires team discussion"
- name: "priority/high"
  color: "e11d21"
  description: "Needs immediate attention"
- name: "priority/medium"
  color: "fbca04"
  description: "Standard scheduling priority"
- name: "priority/low"
  color: "0e8a16"
  description: "Nice to have when time permits"
